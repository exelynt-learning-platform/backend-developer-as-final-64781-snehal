server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: resource-booking-system

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/booking_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.assignment.booking: ${LOG_LEVEL:INFO}
